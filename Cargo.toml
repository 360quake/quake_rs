[package]
name = "quake-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A local MCP server for read-only 360 Quake asset queries"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
httpdate = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["default-tls", "json"] }
rmcp = { version = "=3.11.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "time"] }
wiremock = "0.6"

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
